<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>추세 다이어트</title>
    <meta name="description" content="체중 추세로 목표 칼로리를 맞춰 주는 개인용 다이어트 기록 앱" />

    <!-- 주소창과 상태 표시줄의 색. 테마별 앱 바탕색(--bg)과 같다. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1020" media="(prefers-color-scheme: dark)" />

    <!-- 탭이 어두우면 SVG가 스스로 바탕을 밝힌다. PNG는 SVG 파비콘을 못 쓰는 브라우저용. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- 홈 화면 앱으로 열릴 때. 상태 표시줄은 default: 밝은 테마에서 시계 글자가 어둡게 보이도록 한다.
         (black-translucent는 글자가 늘 흰색이라 밝은 바탕에서 읽을 수 없다.) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="추세" />
    <meta name="application-name" content="추세" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 스크립트와 스타일이 오기 전의 첫 화면. 바탕색을 테마에 맞추고 스플래시를 그린다.
         색은 src/index.css의 --bg, --text와 같아야 하고, 스플래시 구조는 src/components/Splash.tsx와 같아야 한다. -->
    <style>
      html {
        background: #f5f5fa;
        color-scheme: light dark;
      }
      body {
        margin: 0;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 6vh);
        background: #f5f5fa;
        color: #171a33;
      }
      .splash-mark {
        width: 84px;
        height: 84px;
        border-radius: 19px;
        box-shadow: 0 12px 28px -12px rgb(28 30 75 / 55%);
      }
      /* 글꼴 파일이 도착하면서 글자가 바뀌어 보이지 않도록, 스플래시는 기기 글꼴만 쓴다. */
      .splash-name {
        margin: 0;
        font: 700 1.125rem/1.3 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;
        letter-spacing: -0.02em;
      }
      @media (prefers-color-scheme: dark) {
        html,
        .splash {
          background: #0f1020;
        }
        .splash {
          color: #ecedfa;
        }
        .splash-mark {
          box-shadow: 0 0 0 1px rgb(255 255 255 / 9%), 0 12px 28px -12px rgb(0 0 0 / 80%);
        }
      }
      /* 홈 화면 앱에서는 당겨서 새로 고침과 끝에서 튕기는 효과가 실수로 나오지 않게 한다. */
      @media (display-mode: standalone) {
        html,
        body {
          overscroll-behavior-y: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="불러오는 중">
        <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="splash-ground" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#262968" />
              <stop offset="1" stop-color="#171940" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14.5" fill="url(#splash-ground)" />
          <path d="M13.72 23.04C15.63 23.94 21.67 27.73 25.19 28.42C28.71 29.1 31.04 25.25 34.87 27.16C38.69 29.07 45.92 37.76 48.13 39.88" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" />
          <circle cx="48.13" cy="39.88" r="6.9" fill="#1b1d4c" />
          <circle cx="48.13" cy="39.88" r="4.84" fill="#f2b84e" />
        </svg>
        <p class="splash-name">추세 다이어트</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
